<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMA Transfer Lab</title><style>body{margin:0;background:#080b10;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30353d;padding-bottom:18px}.badge{padding:7px 12px;border:1px solid #c9a75a;color:#e7ca7d;border-radius:20px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.card{background:#11151b;border:1px solid #292f38;border-radius:12px;padding:20px}.player{font-size:22px;font-weight:800}.muted{color:#9299a4;font-size:13px}.money{font-size:25px;color:#e4c36a;font-weight:800;margin:12px 0}.row{display:flex;justify-content:space-between;border-top:1px solid #252a31;padding:12px 0}.actions{display:flex;gap:8px;margin-top:14px}.actions button{border:1px solid #3b424c;background:#171c23;color:#fff;padding:10px 14px;border-radius:7px;cursor:pointer}.actions button:hover{border-color:#d6b761}.log{margin-top:18px;max-height:300px;overflow:auto}.item{padding:12px;border-bottom:1px solid #252a31}.status{color:#7fd3a6}.test-note{margin-top:22px;padding:14px;border:1px dashed #555d68;border-radius:8px;color:#b8bec7}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>FTMA TRANSFER LAB</h1><div class="muted">🧪 실제 이적 데이터에 영향을 주지 않는 테스트 환경</div></div><span class="badge">TEST MODE</span></div><div class="grid"><section class="card"><div class="muted">판매 구단</div><div class="player">산초HD</div><div class="muted">선수</div><div class="player">코조-코피 멘사</div><div class="muted">CB / DM · 테스트 선수</div><div class="money">€20M</div><div class="row"><span>구매 구단</span><b>04렙쿠</b></div><div class="row"><span>현재 제안</span><b id="offer">€18M</b></div><div class="actions"><button onclick="offer(20)">€20M 제안</button><button onclick="offer(24)">€24M 역제안</button><button onclick="finish()">합의 테스트</button></div></section><section class="card"><h2>📥 이적 요청함</h2><div class="muted">04렙쿠에서 보낸 테스트 제안</div><div class="item"><b>코조-코피 멘사</b><br><span id="request">€18M · 협상 중</span><div class="actions"><button onclick="accept()">수락</button><button onclick="offer(22)">역제안 €22M</button><button onclick="reject()">거절</button></div></div><div class="test-note">이 페이지의 모든 금액과 상태는 테스트용입니다. 실제 선수 소속, 구단 자금, 이적 기록은 변경되지 않습니다.</div></section></div><section class="card log"><h2>🤝 협상 기록</h2><div id="log"><div class="item">04렙쿠 → 산초HD : €18M 제안 <span class="status">· 진행 중</span></div></div></section></div><script>let price=18;const log=document.getElementById('log');function money(n){return '€'+n+'M'}function add(t){log.innerHTML+='<div class="item">'+t+'</div>';log.scrollTop=log.scrollHeight}function offer(n){price=n;document.getElementById('offer').textContent=money(n);document.getElementById('request').textContent=money(n)+' · 협상 중';add('산초HD ↔ 04렙쿠 : '+money(n)+' 제안 / 역제안')}function accept(){document.getElementById('request').innerHTML=money(price)+' · <span class="status">수락됨</span>';add('산초HD : '+money(price)+' 제안 수락')}function reject(){document.getElementById('request').textContent=money(price)+' · 거절됨';add('산초HD : '+money(price)+' 제안 거절')}function finish(){document.getElementById('request').innerHTML=money(price)+' · <span class="status">합의 완료 (테스트)</span>';add('🤝 산초HD ↔ 04렙쿠 : '+money(price)+' 이적료 합의 완료')}</script></body></html>
