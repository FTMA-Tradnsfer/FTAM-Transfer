<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMA 관리자</title><link rel="stylesheet" href="style.css?v=20260820news4"></head><body><div class="app-shell"><header class="site-header"><div class="header-main"><a class="brand" href="index.html"><span class="brand-seal"><span class="ball">⚽</span><b>FTMA</b><small>EST. 2024</small></span><span class="brand-copy"><strong>FTMA TRANSFER</strong><small>FANTASY TRANSFER MARKET AGENCY</small></span></a><a class="login-btn" href="index.html">사이트로 돌아가기</a></div></header><main class="admin section-pad"><p class="eyebrow">FTMA MANAGEMENT</p><h1>데이터 관리</h1><p class="admin-sub">선수·구단과 FTMA 공식 뉴스 기록을 직접 관리합니다.</p><div class="admin-grid"><section class="admin-card"><h2>선수 등록</h2><form id="playerForm"><label>선수명<input name="name" required></label><label>국적<input name="nationality"></label><label>포지션<input name="position" placeholder="GK / CB / CM / ST"></label><label>생년월일<input name="birth_date" type="date"></label><label>나이<input name="age" type="number" min="0"></label><label>어빌<input name="ability" type="number" min="0"></label><label>포텐<input name="potential" type="number" min="0"></label><label>시장가치<input name="market_value" type="number" min="0" step="0.01" placeholder="예: 8.5"></label><label>소속 구단<select name="current_club_id" id="clubSelect"><option value="">미소속</option></select></label><label>U20 여부<select name="is_u20"><option value="false">아니오</option><option value="true">예</option></select></label><button class="primary-btn" type="submit">선수 등록</button></form></section><section class="admin-card"><h2>구단 등록</h2><form id="clubForm"><label>구단명<input name="name" required></label><label>국가<input name="country"></label><label>리그<input name="league"></label><label>로고 URL<input name="logo_url" type="url"></label><label>구단 설명<textarea name="description" rows="5"></textarea></label><button class="primary-btn" type="submit">구단 등록</button></form></section><section class="admin-card admin-wide"><h2>뉴스 등록</h2><p class="admin-help">이제 이미지 주소(URL)를 입력하지 않습니다. <strong>내 컴퓨터에 있는 이미지 파일을 직접 선택</strong>하면 FTMA 뉴스 대표 이미지로 업로드됩니다.</p><form id="newsForm"><label>기사 제목<input name="title" required placeholder="예: 카치리요 FC, 새로운 공격수 영입"></label><label>카테고리<select name="category"><option value="transfer">이적시장</option><option value="news">뉴스</option><option value="official">공식 발표</option><option value="rumour">이적설</option></select></label><div class="file-upload-box"><label class="file-label">대표 이미지 파일<input id="newsImage" name="cover_image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></label><p class="upload-help">JPG · PNG · WEBP · GIF / 최대 8MB</p><div id="imagePreview" class="image-preview" hidden><img alt="선택한 대표 이미지 미리보기"></div></div><label>요약<input name="summary" placeholder="메인 화면에 표시될 기사 요약"></label><label>기사 본문<textarea name="body" rows="10" required placeholder="기사 내용을 입력하세요."></textarea></label><label>게시 상태<select name="published"><option value="true">공개</option><option value="false">비공개</option></select></label><button class="primary-btn" type="submit">이미지 업로드 후 뉴스 등록</button></form></section></div><div id="message" class="admin-message"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=20260820news4"></script></body></html>
