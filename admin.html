<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMA Admin</title><link rel="stylesheet" href="style.css"></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">FT</span><span><strong>FTMA</strong><small>ADMIN CONSOLE</small></span></a><a class="login-btn" href="index.html">사이트로 돌아가기</a></header><main class="admin section-pad"><p class="eyebrow">FTMA MANAGEMENT</p><h1>데이터 관리</h1><p class="admin-sub">실제 FTMA 선수와 구단을 직접 등록합니다. 등록 내용은 데이터베이스에 저장됩니다.</p><div class="admin-grid"><section class="admin-card"><h2>선수 등록</h2><form id="playerForm"><label>선수명<input name="name" required></label><label>국적<input name="nationality"></label><label>포지션<input name="position" placeholder="GK / CB / CM / ST"></label><label>생년월일<input name="birth_date" type="date"></label><label>어빌<input name="ability" type="number" min="0"></label><label>포텐<input name="potential" type="number" min="0"></label><label>시장가치<input name="market_value" type="number" min="0" step="0.01" placeholder="예: 8.5"></label><label>소속 구단<select name="current_club_id" id="clubSelect"><option value="">미소속</option></select></label><label>U20 여부<select name="is_u20"><option value="false">아니오</option><option value="true">예</option></select></label><button class="primary-btn" type="submit">선수 등록</button></form></section><section class="admin-card"><h2>구단 등록</h2><form id="clubForm"><label>구단명<input name="name" required></label><label>국가<input name="country"></label><label>리그<input name="league"></label><label>로고 URL<input name="logo_url" type="url"></label><label>구단 설명<textarea name="description" rows="5"></textarea></label><button class="primary-btn" type="submit">구단 등록</button></form></section></div><div id="message" class="admin-message"></div></main></div><script src="admin.js"></script></body></html>
