<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMA 관리자</title><link rel="stylesheet" href="style.css?v=20260821adminfix4"><link rel="stylesheet" href="transfer.css?v=20260821adminfix4"><style>.admin-lock{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#090a0b;padding:20px}.admin-lock-card{width:min(420px,100%);border:1px solid #514731;background:#111315;padding:36px}.admin-lock-seal{width:66px;height:66px;border:1px solid #d4b879;border-radius:50%;display:grid;place-items:center;color:#e4c987;font-weight:900;margin-bottom:24px}.admin-lock-card .eyebrow{color:#e4c987;font-size:9px}.admin-lock-card h1{font-size:27px;margin:8px 0}.admin-lock-card p{color:#9d9587;font-size:10px;line-height:1.7}.admin-lock-card label{display:block;color:#bdb4a5;font-size:10px;margin:22px 0 8px}.admin-lock-card input{width:100%;box-sizing:border-box;background:#08090a;color:#fff;border:1px solid #4d4535;padding:13px}.admin-lock-card button{width:100%;margin-top:14px}.admin-lock-error{min-height:15px;color:#d76b5f;font-size:9px;margin-top:10px}.admin-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px!important;align-items:start}.admin-wide{grid-column:1/-1}.admin-card{padding:28px!important;background:linear-gradient(145deg,#181a1d,#111315)!important;border:1px solid #2d3034!important}.admin-card label{display:block!important;color:#aaa69e!important;font-size:9px!important;margin:14px 0 0!important}.admin-card input:not([type=file]),.admin-card select,.admin-card textarea{display:block!important;width:100%!important;box-sizing:border-box!important;margin-top:7px!important;background:#0b0d0f!important;border:1px solid #303338!important;color:#eee!important;padding:12px!important}.admin-card .primary-btn{width:100%;margin-top:22px!important}.file-upload-box{display:block!important;border:1px solid #3a3a37!important;background:#0f1113!important;padding:16px!important;margin:16px 0!important}.file-upload-box input[type=file]{display:block!important;width:100%!important;margin-top:10px!important;color:#eee!important;background:#15171a!important;padding:9px!important;border:1px solid #3a3a37!important}.upload-help{font-size:9px;color:#77736c;margin:8px 0 0}.image-preview{margin-top:12px;max-width:180px;border:1px solid #3b362d;background:#08090a}.image-preview img{display:block;width:100%;height:auto;max-height:220px;object-fit:contain}@media(max-width:900px){.admin-grid{grid-template-columns:1fr!important}.admin-wide{grid-column:auto}}</style></head><body class="admin-locked"><div id="adminLock" class="admin-lock"><div class="admin-lock-card"><div class="admin-lock-seal">FTMA</div><p class="eyebrow">FTMA MANAGEMENT</p><h1>관리자 로그인</h1><p>FTMA 데이터를 관리하려면 관리자 비밀번호를 입력하세요.</p><form id="adminLoginForm"><label for="adminPassword">관리자 비밀번호</label><input id="adminPassword" type="password" autocomplete="current-password" autofocus required><button id="adminLoginButton" class="primary-btn" type="submit">관리자 페이지 입장</button><div id="adminLoginError" class="admin-lock-error" role="alert" aria-live="polite"></div></form></div></div><div id="adminApp" hidden><div class="app-shell"><header class="site-header"><div class="header-main"><a class="brand" href="index.html"><span class="brand-seal"><b>FTMA</b><small>EST. 2024</small></span><span class="brand-copy"><strong>FTMA TRANSFER</strong><small>FANTASY TRANSFER MARKET AGENCY</small></span></a><a class="login-btn" href="index.html">사이트로 돌아가기</a></div></header><main class="admin section-pad"><p class="eyebrow">FTMA MANAGEMENT</p><h1>데이터 관리</h1><p class="admin-sub">선수·구단·뉴스·이적 기록을 직접 관리합니다.</p><div class="admin-grid"><section class="admin-card"><h2>선수 등록</h2><form id="playerForm"><label>선수명<input name="name" required></label><div class="file-upload-box"><label for="playerImage">선수 메인 이미지</label><input id="playerImage" name="photo_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><p class="upload-help">파일 직접 첨부 · 최대 8MB</p><div id="playerImagePreview" class="image-preview" hidden><img alt="선수 이미지 미리보기"></div></div><label>국적<input name="nationality"></label><label>포지션<input name="position" placeholder="GK / CB / CM / ST"></label><label>생년월일<input name="birth_date" type="date"></label><label>나이<input name="age" type="number"></label><label>어빌<input name="ability" type="number"></label><label>포텐<input name="potential" type="number"></label><label>시장가치<input name="market_value" type="number" step="0.01"></label><label>소속 구단<select name="current_club_id" id="clubSelect"><option value="">미소속</option></select></label><label>선수단 유형<select name="squad_type"><option value="first_team">1군</option><option value="u20">U20</option></select></label><label>등번호<input name="shirt_number" type="number" min="0"></label><button class="primary-btn" type="submit">이미지 업로드 후 선수 등록</button></form></section><section class="admin-card"><h2>구단 등록</h2><form id="clubForm"><label>구단명<input name="name" required></label><label>국가<input name="country"></label><label>리그<input name="league"></label><div class="file-upload-box"><label for="clubLogoFile">구단 엠블럼 파일</label><input id="clubLogoFile" name="logo_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><p class="upload-help">컴퓨터에서 이미지 파일을 직접 선택하세요. 최대 8MB.</p><div id="clubLogoPreview" class="image-preview" hidden><img alt="구단 엠블럼 미리보기"></div></div><label>구단 설명<textarea name="description" rows="5"></textarea></label><button class="primary-btn" type="submit">엠블럼 업로드 후 구단 등록</button></form></section><section class="admin-card admin-wide"><h2>뉴스 등록</h2><form id="newsForm"><label>기사 제목<input name="title" required></label><label>카테고리<select name="category"><option value="transfer">이적시장</option><option value="news">뉴스</option><option value="official">공식 발표</option><option value="rumour">이적설</option></select></label><div class="file-upload-box"><label for="newsImage">대표 이미지 파일</label><input id="newsImage" name="cover_image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><p class="upload-help">컴퓨터에서 이미지 파일을 직접 선택하세요. 최대 8MB.</p><div id="imagePreview" class="image-preview" hidden><img alt="선택한 대표 이미지 미리보기"></div></div><label>요약<input name="summary"></label><label>기사 본문<textarea name="body" rows="10" required></textarea></label><label>게시 상태<select name="published"><option value="true">공개</option><option value="false">비공개</option></select></label><button class="primary-btn" type="submit">이미지 업로드 후 뉴스 등록</button></form></section></div><div id="message" class="admin-message"></div></main></div></div><script src="admin-login.js?v=20260821login9"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=20260821admin23"></script><script src="admin-media.js?v=20260821media9"></script><script src="admin-manage.js?v=20260821manage11"></script></body></html>
